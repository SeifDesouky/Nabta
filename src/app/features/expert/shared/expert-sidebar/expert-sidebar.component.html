<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <span class="material-symbols-outlined ms-fill">agriculture</span>
    </div>
    <span class="logo-text">NABTA</span>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">

    <p class="nav-label">Menu</p>

    <!-- 🔥 Community (Manual Item) -->
    <div #communityBtn
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-[.875rem]
                cursor-pointer select-none"
         (mouseenter)="showCommunityFlyout(communityBtn)"
         (mouseleave)="scheduleHideCommunityFlyout()">

      <span class="material-symbols-outlined"
            style="font-size:20px;font-variation-settings:'FILL' 1;">
        groups
      </span>

      <span>Community</span>

      <span class="material-symbols-outlined ml-auto text-white/60"
            style="font-size:15px;">
        chevron_right
      </span>
    </div>

    <!-- باقي الـ menu -->
    <a *ngFor="let item of mainNav"
       [routerLink]="item.route"
       routerLinkActive="nav-active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="nav-item">
      <span class="material-symbols-outlined" [class.ms-fill]="item.filled">
        {{ item.icon }}
      </span>
      <span>{{ item.label }}</span>
    </a>

    <div class="nav-divider"></div>

    <p class="nav-label">Support</p>

    <a *ngFor="let item of supportNav"
       [routerLink]="item.route"
       routerLinkActive="nav-active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="nav-item">
      <span class="material-symbols-outlined">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>

  </nav>
</aside>

<div class="fixed z-[9999] w-56 bg-white rounded-3xl overflow-hidden
            shadow-[0_8px_32px_rgba(0,0,0,0.13)] border border-[#eaeaea] transition-all duration-200"
     *ngIf="communityFlyoutOpen"
     [style.top]="communityFlyoutTop"
     [style.left]="communityFlyoutLeft"
     (mouseenter)="keepCommunityFlyout()"
     (mouseleave)="scheduleHideCommunityFlyout()">

  <div class="py-1.5">

    <a routerLink="/community/tips"
       class="flex items-center gap-3 px-4 py-2.5 hover:bg-green-50 cursor-pointer">
      <span class="material-symbols-outlined text-primary">lightbulb</span>
      <span>Tips & Tricks</span>
    </a>

    <a class="flex items-center gap-3 px-4 py-2.5 hover:bg-green-50 cursor-pointer">
      <span class="material-symbols-outlined text-primary">psychology</span>
      <span>Expert Q&A</span>
    </a>

  </div>
</div>
