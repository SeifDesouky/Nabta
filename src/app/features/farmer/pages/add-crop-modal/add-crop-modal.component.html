<div class="modal-overlay"
     [class.modal-visible]="svc.modalOpen"
     (click)="onBackdropClick($event)">
  <div class="modal-backdrop"></div>

  <div class="modal-card" *ngIf="svc.modalOpen" [formGroup]="form">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-icon-wrap">
          <span class="material-symbols-outlined ms-fill">eco</span>
        </div>
        <div>
          <h3 class="modal-title">Add New Crop</h3>
          <p class="modal-sub">Register a new crop to your farm</p>
        </div>
      </div>
      <button class="icon-btn" (click)="close()" type="button" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Crop Name -->
      <div class="field-group">
        <label class="field-label">Crop Name <span class="required">*</span></label>
        <input class="field-input"
               formControlName="cropName"
               type="text"
               placeholder="e.g. Winter Wheat, Tomatoes…"
               [class.field-error]="form.get('cropName')?.invalid && form.get('cropName')?.touched" />
        <p class="error-hint" *ngIf="form.get('cropName')?.invalid && form.get('cropName')?.touched">
          Crop name is required (min 2 characters)
        </p>
      </div>

      <!-- Planting Date -->
      <div class="field-group">
        <label class="field-label">Planting Date <span class="required">*</span></label>
        <input class="field-input"
               formControlName="plantingDate"
               type="date"
               [max]="today"
               [class.field-error]="form.get('plantingDate')?.invalid && form.get('plantingDate')?.touched" />
        <p class="error-hint" *ngIf="form.get('plantingDate')?.invalid && form.get('plantingDate')?.touched">
          Planting date is required
        </p>
      </div>

      <!-- Area Size -->
      <div class="field-group">
        <label class="field-label">Area Size <span class="field-optional">(optional, in acres)</span></label>
        <input class="field-input"
               formControlName="areaSize"
               type="number"
               min="0"
               step="0.1"
               placeholder="e.g. 5.5" />
      </div>

      <!-- Soil Types -->
      <div class="field-group">
        <label class="field-label">Soil Types <span class="field-optional">(optional, select all that apply)</span></label>
        <div class="soil-grid">
          <button *ngFor="let type of soilTypes"
                  type="button"
                  class="soil-chip"
                  [class.soil-chip-active]="isSoilSelected(type)"
                  (click)="toggleSoil(type)">
            <span class="material-symbols-outlined soil-check" *ngIf="isSoilSelected(type)">check</span>
            {{ type }}
          </button>
        </div>
      </div>

      <!-- Error -->
      <p class="form-error" *ngIf="errorMsg">
        <span class="material-symbols-outlined">error</span>
        {{ errorMsg }}
      </p>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" type="button" (click)="close()">Cancel</button>
      <button class="btn-submit"
              type="button"
              (click)="submit()"
              [disabled]="form.invalid || svc.addCropLoading">
        <span class="spinner" *ngIf="svc.addCropLoading"></span>
        <span class="material-symbols-outlined ms-fill" *ngIf="!svc.addCropLoading">add_circle</span>
        {{ svc.addCropLoading ? 'Adding…' : 'Add Crop' }}
      </button>
    </div>

  </div>
</div>
