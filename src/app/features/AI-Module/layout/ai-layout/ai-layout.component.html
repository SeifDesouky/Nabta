<!-- ════════════════════════════════════════════════════════════════
     ai-layout.component.html  (FIXED)
     — [style.margin-left] on main area synced with sidebar width
     — (collapseChange) wires sidebar → layout
════════════════════════════════════════════════════════════════ -->

<!-- ══ SIDEBAR ══ -->
<!--
  (collapseChange) fires whenever the user clicks the collapse toggle.
  The layout receives the new boolean and updates mainMargin.
-->
<app-ai-sidebar (collapseChange)="onSidebarCollapse($event)" />

<!-- ══ MAIN AREA ══ -->
<div class="min-h-screen flex flex-col transition-all duration-300"
     [style.margin-left]="mainMargin">

  <!-- ── Sticky Header ─────────────────────────────── -->
  <header class="w-full h-16 bg-white/90 backdrop-blur-md border-b border-[#e8e8e8]
                 flex items-center justify-between px-8 sticky top-0 z-30">

    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm">
      <span class="text-text-sub font-medium">AI Tools</span>
      <span class="material-symbols-outlined text-zinc-300" style="font-size:16px;">chevron_right</span>
      <div class="flex items-center gap-1.5">
        <span class="material-symbols-outlined text-primary"
              style="font-size:16px;font-variation-settings:'FILL' 1;">{{ currentPage.icon }}</span>
        <span class="font-bold text-text-main">{{ currentPage.label }}</span>
      </div>
    </div>

    <!-- Right: bell + user -->
    <div class="flex items-center gap-2 pl-5 border-l border-[#e8e8e8] ml-4">

      <div class="relative">
        <button (click)="toggleNotif()"
          class="relative p-2 text-zinc-500 hover:bg-[#f3f3f3] rounded-full transition-colors">
          <span class="material-symbols-outlined" style="font-size:22px;">notifications</span>
          <span *ngIf="unreadCount > 0"
                class="absolute top-1.5 right-1.5 w-2 h-2 bg-primary rounded-full"></span>
        </button>

        <div *ngIf="notifOpen"
             class="absolute right-0 top-11 w-72 bg-white border border-[#e8e8e8] rounded-2xl
                    shadow-[0_8px_32px_rgba(0,0,0,0.12)] z-50 overflow-hidden">
          <div class="px-4 py-3 border-b border-[#f0f0f0] flex items-center justify-between">
            <p class="text-sm font-bold text-text-main">Notifications</p>
          </div>
          <div class="px-4 py-8 text-center">
            <span class="material-symbols-outlined text-zinc-300 block mb-2" style="font-size:32px;">
              notifications_none
            </span>
            <p class="text-xs text-text-sub">No new notifications</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2.5 pl-3">
        <div class="w-8 h-8 rounded-full bg-primary/10 border border-primary/20
                    flex items-center justify-center">
          <span class="material-symbols-outlined text-primary"
                style="font-size:22px;font-variation-settings:'FILL' 1;">account_circle</span>
        </div>
        <div class="hidden sm:block">
          <p class="text-xs font-semibold text-text-main leading-tight">My Account</p>
          <p class="text-[10px] text-zinc-400">AI Tools</p>
        </div>
      </div>

    </div>
  </header>

  <!-- ── Page content ───────────────────────────────── -->
  <div class="flex-1 p-8">
    <router-outlet />
  </div>

  <!-- ── Mobile bottom nav ──────────────────────────── -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-[#e8e8e8]
              flex items-center justify-around z-40">
    <a routerLink="/ai/chatbot"
       routerLinkActive="text-primary font-bold"
       class="flex flex-col items-center gap-1 text-zinc-400">
      <span class="material-symbols-outlined"
            style="font-size:22px;font-variation-settings:'FILL' 1;">smart_toy</span>
      <span class="text-[10px]">Chatbot</span>
    </a>
    <a routerLink="/ai/yield-prediction"
       routerLinkActive="text-primary font-bold"
       class="flex flex-col items-center gap-1 text-zinc-400">
      <span class="material-symbols-outlined" style="font-size:22px;">monitoring</span>
      <span class="text-[10px]">Yield</span>
    </a>
    <a routerLink="/ai/recommendation"
       routerLinkActive="text-primary font-bold"
       class="flex flex-col items-center gap-1 text-zinc-400">
      <span class="material-symbols-outlined"
            style="font-size:22px;font-variation-settings:'FILL' 1;">yard</span>
      <span class="text-[10px]">Crops</span>
    </a>
  </nav>

</div>
