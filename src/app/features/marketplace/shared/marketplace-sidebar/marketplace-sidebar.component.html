<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <span class="material-symbols-outlined ms-fill">agriculture</span>
    </div>
    <span class="logo-text">NABTA</span>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">

    <p class="nav-label">Menu</p>

    <!-- Dynamic Nav Items -->
    <ng-container *ngFor="let item of navItems">

      <!-- AI Tools Trigger -->
      <ng-container *ngIf="item.isAiTrigger; else normalLink">
        <div #aiBtn
             class="nav-item cursor-pointer select-none"
             (mouseenter)="showAiFlyout(aiBtn)"
             (mouseleave)="scheduleHideAiFlyout()">
          <span class="material-symbols-outlined" [class.ms-fill]="item.filled">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          <span class="material-symbols-outlined ml-auto text-zinc-400" style="font-size:15px;">chevron_right</span>
        </div>
      </ng-container>

      <!-- Normal Link -->
      <ng-template #normalLink>
        <a [routerLink]="item.route"
           routerLinkActive="nav-active"
           [routerLinkActiveOptions]="{ exact: item.route === '/' }"
           class="nav-item">
          <span class="material-symbols-outlined" [class.ms-fill]="item.filled">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </ng-template>

    </ng-container>

    <!-- Divider + Filters (مش للـ admin) -->
    <ng-container *ngIf="showFilters">

      <div class="nav-divider"></div>

      <!-- Filters Header -->
      <div class="flex items-center justify-between mb-4 mt-2 px-1">
        <p class="nav-label !m-0 !p-0">Filters</p>
        <button (click)="clearFilters()"
                class="text-[11px] text-primary font-semibold hover:underline">
          Clear all
        </button>
      </div>

      <!-- Category -->
      <div class="mb-5 px-1">
        <h3 class="text-xs font-bold text-text-main mb-3">Category</h3>
        <div class="flex flex-wrap gap-2">
          <button *ngFor="let cat of categories"
                  (click)="selectCategory(cat)"
                  class="px-3 py-1.5 rounded-full text-[11px] font-semibold transition-all"
                  [ngClass]="selectedCategory === cat
                    ? 'bg-primary text-white shadow-primary-glow'
                    : 'bg-white border border-border-color text-zinc-500 hover:border-primary hover:text-primary'">
            {{ cat }}
          </button>
        </div>
      </div>

      <!-- Price Range -->
      <div class="mb-5 px-1">
        <h3 class="text-xs font-bold text-text-main mb-3">Price Range</h3>
        <input type="range"
               class="price-slider mb-3"
               min="0"
               [max]="priceMax"
               [value]="selectedPrice"
               (input)="onPriceChange($event)"
               [style.background]="'linear-gradient(to right, var(--primary) ' + pricePct + '%, #e2e5dd ' + pricePct + '%)'"/>
        <div class="flex items-center justify-between gap-2">
          <div class="flex-1 text-center px-2.5 py-1.5 bg-white rounded-xl border border-border-color text-xs font-semibold text-text-sub">$0</div>
          <span class="text-[10px] text-zinc-400">—</span>
          <div class="flex-1 text-center px-2.5 py-1.5 bg-white rounded-xl border border-primary/40 text-xs font-bold text-primary">
            ${{ selectedPrice }}
          </div>
        </div>
      </div>

      <!-- Location -->
      <div class="mb-5 px-1">
        <h3 class="text-xs font-bold text-text-main mb-2.5">Location</h3>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"
                style="font-size:15px;">location_on</span>
          <input type="text"
                 placeholder="Region or State"
                 [ngModel]="locationQuery"
                 (ngModelChange)="onLocationChange($event)"
                 class="w-full pl-8 pr-3 py-2 bg-white border border-border-color rounded-xl text-xs text-text-main placeholder:text-zinc-400 focus:border-primary focus:ring-0 transition-colors"/>
        </div>
      </div>

      <!-- Seller Rating -->
      <div class="px-1">
        <h3 class="text-xs font-bold text-text-main mb-2.5">Seller Rating</h3>
        <div class="space-y-2">
          <label *ngFor="let r of ratings"
                 class="flex items-center gap-2.5 cursor-pointer group"
                 (click)="selectRating(r)">
            <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors"
                 [ngClass]="selectedRating === r
                   ? 'border-primary bg-primary'
                   : 'border-border-color bg-white group-hover:border-primary'">
              <div *ngIf="selectedRating === r" class="w-1.5 h-1.5 rounded-full bg-white"></div>
            </div>
            <div class="flex items-center gap-0.5 text-earth">
              <span *ngFor="let s of [1,2,3,4,5]"
                    class="material-symbols-outlined"
                    style="font-size:13px;"
                    [style.font-variation-settings]="getStarFill(s, r)">star</span>
              <span class="text-[11px] text-zinc-400 ml-1">&amp; up</span>
            </div>
          </label>
        </div>
      </div>

    </ng-container>
  </nav>
</aside>

<!-- AI Flyout (farmer فقط) -->
<div *ngIf="aiFlyoutOpen && showAiTools"
     class="fixed z-[9999] w-56 bg-white rounded-3xl overflow-hidden shadow-[0_8px_32px_rgba(0,0,0,0.13)] border border-[#eaeaea] transition-all duration-200"
     [style.top]="aiFlyoutTop"
     [style.left]="aiFlyoutLeft"
     (mouseenter)="keepAiFlyout()"
     (mouseleave)="scheduleHideAiFlyout()">
  <div class="py-1.5">
    <a *ngFor="let tool of aiTools"
       [routerLink]="tool.route"
       class="flex items-center gap-3 px-4 py-2.5 hover:bg-green-50 transition-colors group">
      <div class="w-7 h-7 rounded-lg bg-primary/10 flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-primary"
              style="font-size:15px;font-variation-settings:'FILL' 1;">{{ tool.icon }}</span>
      </div>
      <span class="text-sm font-medium text-zinc-600 group-hover:text-primary transition-colors">
        {{ tool.label }}
      </span>
      <span class="material-symbols-outlined ml-auto text-zinc-300 group-hover:text-primary transition-colors"
            style="font-size:14px;">arrow_forward</span>
    </a>
  </div>
</div>
