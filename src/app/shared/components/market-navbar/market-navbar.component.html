 <!-- Top Header -->
  <header class="w-full h-16 bg-white/90 backdrop-blur-md border-b border-[#e8e8e8]
                 flex items-center justify-between px-8 sticky top-0 z-30">
    <div class="flex items-center gap-4 flex-1">
      <div class="relative w-full">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"
          style="font-size:18px;">search</span>
        <input type="text" placeholder="Search seeds, equipment, or produce..."
          class="w-full pl-9 pr-4 py-2 bg-[#f3f3f3] border border-transparent rounded-full text-sm
                 text-on-surface placeholder:text-zinc-400
                 focus:border-primary focus:ring-0 focus:border-1.5 transition-colors"/>
      </div>
    </div>
    <div class="flex items-center gap-2 pl-5 border-l border-[#e8e8e8] ml-4">
      <button class="relative p-2 text-zinc-500 hover:bg-[#f3f3f3] rounded-full transition-colors">
        <span class="material-symbols-outlined" style="font-size:22px;">notifications</span>
        <span class="absolute top-2 right-2 w-2 h-2 bg-tertiary rounded-full"></span>
      </button>
      <button class="relative p-2 text-zinc-500 hover:bg-[#f3f3f3] rounded-full transition-colors">
        <span class="material-symbols-outlined" style="font-size:22px;">shopping_cart</span>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-earth rounded-full border border-white"></span>
      </button>
      <div class="flex items-center gap-2.5 pl-3">
        <div class="w-8 h-8 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center overflow-hidden">
          <span class="material-symbols-outlined text-primary" style="font-size:22px;font-variation-settings:'FILL' 1;">account_circle</span>
        </div>
        <div class="hidden sm:block">
          <p class="text-xs font-semibold text-text-main leading-tight">Marketplace Admin</p>
          <p class="text-[10px] text-zinc-400">Admin</p>
        </div>
      </div>
    </div>
  </header>
